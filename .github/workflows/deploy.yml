name: Build and Deploy to GKE

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: retribution-x-499314
  GAR_LOCATION: europe-west3
  REPOSITORY: retribution-shared-registry   # <-- Your new central registry
  IMAGE: hello-world-app
  CLUSTER_NAME: retribution-dev-cluster     # <-- Your new cluster name
  CLUSTER_REGION: europe-west3
  WORKLOAD_IDENTITY_PROVIDER: projects/45045837124/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SERVICE_ACCOUNT: github-actions-sa@retribution-x-499314.iam.gserviceaccount.com

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest
    
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        token_format: 'access_token'
        workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}

    - name: Docker Auth
      uses: 'docker/login-action@v3'
      with:
        registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
        username: 'oauth2accesstoken'
        password: ${{ steps.auth.outputs.access_token }}

    - name: Build and Push Container
      run: |
        docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest .
        docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest

    - name: Set up GKE credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ env.CLUSTER_NAME }}
        location: ${{ env.CLUSTER_REGION }}

    - name: Deploy to GKE Namespace
      run: |
        # We apply the manifest, explicitly pointing kubectl to your new namespace
        kubectl apply -f deployment.yaml -n retribution-platform-dev